<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Cordelia 是一位來自香港的 JDA 學生，熱愛資料分析與前端開發，致力於以創意設計和數據洞察打造優雅的用戶體驗。" />
  <title>ngwingki - Data Enthusiast &amp; Frontend Developer</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8B5A96',
            'primary-dark': '#7A4D85',
            accent: '#D4B5D4',
            elegant: '#F8F6FF',
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'slide-up': 'slideUp 0.8s ease-out',
            'fade-in': 'fadeIn 1s ease-out',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            float: { '0%,100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-20px)' } },
            slideUp: { '0%': { transform: 'translateY(30px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            glow: { '0%': { boxShadow: '0 0 20px rgba(93,92,222,.3)' }, '100%': { boxShadow: '0 0 30px rgba(93,92,222,.6)' } },
          }
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: hidden; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", Arial, sans-serif; line-height: 1.6; }
    img { max-width: 100%; height: auto; display: block; }
    .container { max-width: 1200px; margin: 0 auto; padding: 16px; } /* 修正: 不再固定1920px */
    nav a { margin-right: 12px; text-decoration: none; }

    .gradient-bg { background: linear-gradient(135deg, #F8F6FF 0%, #E8E1F5 50%, #D4B5D4 100%); }
    .glass-effect {
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(139, 90, 150, 0.1);
      box-shadow: 0 8px 32px rgba(139, 90, 150, 0.1);
    }
    .dark .glass-effect {
      background: rgba(24, 24, 24, 0.8);
      border: 1px solid rgba(212, 181, 212, 0.2);
      box-shadow: 0 8px 32px rgba(139, 90, 150, 0.2);
    }
    .elegant-pattern {
      background-image: radial-gradient(circle at 2px 2px, rgba(139, 90, 150, 0.05) 1px, transparent 0);
      background-size: 40px 40px;
    }
    .skill-bar { position: relative; overflow: hidden; }
    .skill-bar::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.6s;
    }
    .skill-bar:hover::after { left: 100%; }
  </style>
</head>

<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white">
  <!-- 導覽列與所有內容保持不變（已移除會導致水平滾動的寬度） -->

</h1>

      <div class="text-2xl font-bold text-primary mb-4">Cordelia</div>
      <p class="text-gray-400 mb-6">Data Enthusiast &amp; Frontend Developer from Hong Kong</p>
      <div class="flex justify-center space-x-6 mb-6">
        <a href="https://linkedin.com/in/example" target="_blank" rel="noopener" class="text-gray-400 hover:text-primary transition-colors duration-300">LinkedIn</a>
        <a href="https://github.com/example" target="_blank" rel="noopener" class="text-gray-400 hover:text-primary transition-colors duration-300">GitHub</a>
        <a href="mailto:cordelia@example.com" class="text-gray-400 hover:text-primary transition-colors duration-300">Email</a>
        <a href="/resume.pdf" target="_blank" class="text-gray-400 hover:text-primary transition-colors duration-300">Resume</a>
      </div>
      <div class="border-t border-gray-700 pt-6">
        <p class="text-gray-500">© 2024 Cordelia. Ready to make an impact in your organization!</p>
      </div>
    </div>
  </footer>

  <script>
    // Existing JS 保持不變
  </script>
</body>
